<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel X SMS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glow {
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .online-dot {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body class="font-['Share_Tech']">
    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-4xl text-white glow mb-2">PANEL X SMS</h1>
                <p class="text-gray-300">Admin Panel Login</p>
            </div>
            <form id="loginForm">
                <div class="mb-4">
                    <input type="text" id="username" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:border-white">
                </div>
                <div class="mb-6">
                    <input type="password" id="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/30 focus:outline-none focus:border-white">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-lg font-bold hover:shadow-lg transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="hidden min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl text-white glow">PANEL X SMS - ADMIN</h1>
                <button onclick="logout()" class="px-4 py-2 bg-red-500/20 text-red-300 rounded-lg hover:bg-red-500/30">Logout</button>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="glass-card p-6">
                    <div class="text-gray-300 text-sm">TODAY USERS</div>
                    <div class="text-3xl text-white font-bold" id="todayUsers">0</div>
                </div>
                <div class="glass-card p-6">
                    <div class="text-gray-300 text-sm">YESTERDAY</div>
                    <div class="text-3xl text-white font-bold" id="yesterdayUsers">0</div>
                </div>
                <div class="glass-card p-6">
                    <div class="text-gray-300 text-sm">MONTHLY</div>
                    <div class="text-3xl text-white font-bold" id="monthlyUsers">0</div>
                </div>
                <div class="glass-card p-6">
                    <div class="text-gray-300 text-sm">TOTAL</div>
                    <div class="text-3xl text-white font-bold" id="totalUsers">0</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b border-white/20">
                <button onclick="showTab('blocked')" class="tab-btn px-6 py-3 text-white font-bold border-b-2 border-transparent hover:border-pink-500" id="tabBlocked">Blocked Devices</button>
                <button onclick="showTab('apis')" class="tab-btn px-6 py-3 text-white font-bold border-b-2 border-transparent hover:border-pink-500" id="tabApis">SMS APIs</button>
                <button onclick="showTab('update')" class="tab-btn px-6 py-3 text-white font-bold border-b-2 border-transparent hover:border-pink-500" id="tabUpdate">App Update</button>
            </div>

            <!-- Blocked Devices Tab -->
            <div id="blockedTab" class="glass-card p-6">
                <h2 class="text-2xl text-white mb-4">Blocked Devices</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-white">
                        <thead class="border-b border-white/20">
                            <tr>
                                <th class="text-left py-3">Device Name</th>
                                <th class="text-left py-3">Model</th>
                                <th class="text-left py-3">Build Number</th>
                                <th class="text-left py-3">Number</th>
                                <th class="text-left py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="blockedList"></tbody>
                    </table>
                </div>
            </div>

            <!-- APIs Tab -->
            <div id="apisTab" class="hidden glass-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl text-white">SMS APIs</h2>
                    <button onclick="showAddApiModal()" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">+ Add API</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-white">
                        <thead class="border-b border-white/20">
                            <tr>
                                <th class="text-left py-3">Name</th>
                                <th class="text-left py-3">URL</th>
                                <th class="text-left py-3">Method</th>
                                <th class="text-left py-3">Status</th>
                                <th class="text-left py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="apisList"></tbody>
                    </table>
                </div>
            </div>

            <!-- Update Tab -->
            <div id="updateTab" class="hidden glass-card p-6">
                <h2 class="text-2xl text-white mb-4">App Update Control</h2>
                <form id="updateForm" class="space-y-4">
                    <div>
                        <label class="text-white block mb-2">Update Available</label>
                        <select id="updateAvailable" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-white block mb-2">Version</label>
                        <input type="text" id="updateVersion" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30" placeholder="1.0.0">
                    </div>
                    <div>
                        <label class="text-white block mb-2">Update Link</label>
                        <input type="text" id="updateLink" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30" placeholder="https://...">
                    </div>
                    <div>
                        <label class="text-white block mb-2">Force Update</label>
                        <select id="updateForce" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <button type="submit" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Save Update Settings</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add API Modal -->
    <div id="addApiModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="glass-card p-8 w-full max-w-md">
            <h2 class="text-2xl text-white mb-4">Add New API</h2>
            <form id="addApiForm">
                <div class="mb-4">
                    <input type="text" id="apiName" placeholder="API Name" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                </div>
                <div class="mb-4">
                    <input type="text" id="apiUrl" placeholder="API URL (use {number} for phone number)" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                </div>
                <div class="mb-4">
                    <select id="apiMethod" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                    </select>
                </div>
                <div class="mb-4">
                    <select id="apiStatus" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="flex-1 py-2 bg-green-500 text-white rounded-lg">Save</button>
                    <button type="button" onclick="closeAddApiModal()" class="flex-1 py-2 bg-gray-500 text-white rounded-lg">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTab = 'blocked';
        let apiUrl = window.location.origin;

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                loadDashboard();
            } else {
                alert('Invalid credentials!');
            }
        });

        async function loadDashboard() {
            await loadStats();
            await loadBlockedDevices();
            await loadApis();
            await loadUpdateSettings();
        }

        async function loadStats() {
            const res = await fetch('/api/admin/usage');
            const data = await res.json();
            document.getElementById('todayUsers').textContent = data.today || 0;
            document.getElementById('yesterdayUsers').textContent = data.yesterday || 0;
            document.getElementById('monthlyUsers').textContent = data.monthly || 0;
            document.getElementById('totalUsers').textContent = data.total || 0;
        }

        async function loadBlockedDevices() {
            const res = await fetch('/api/admin/blocked');
            const data = await res.json();
            const tbody = document.getElementById('blockedList');
            tbody.innerHTML = data.map(device => `
                <tr class="border-b border-white/10">
                    <td class="py-3">${device.deviceName || 'Unknown'}</td>
                    <td class="py-3">${device.deviceModel || 'Unknown'}</td>
                    <td class="py-3">${device.buildNumber || 'Unknown'}</td>
                    <td class="py-3">${device.number || 'Unknown'}</td>
                    <td class="py-3">
                        <button onclick="unblockDevice('${device.deviceId}')" class="px-3 py-1 bg-green-500 text-white rounded text-sm">Unblock</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadApis() {
            const res = await fetch('/api/apis');
            const data = await res.json();
            const tbody = document.getElementById('apisList');
            tbody.innerHTML = data.map(api => `
                <tr class="border-b border-white/10">
                    <td class="py-3">${api.name}</td>
                    <td class="py-3">${api.url}</td>
                    <td class="py-3">${api.method}</td>
                    <td class="py-3">
                        <span class="px-2 py-1 rounded text-xs ${api.status === 'active' ? 'bg-green-500' : 'bg-red-500'}">${api.status}</span>
                    </td>
                    <td class="py-3">
                        <button onclick="editApi(${api.id})" class="px-2 py-1 bg-blue-500 text-white rounded text-sm mr-2">Edit</button>
                        <button onclick="deleteApi(${api.id})" class="px-2 py-1 bg-red-500 text-white rounded text-sm">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadUpdateSettings() {
            const res = await fetch('/api/check-update');
            const data = await res.json();
            document.getElementById('updateAvailable').value = data.available;
            document.getElementById('updateVersion').value = data.version || '';
            document.getElementById('updateLink').value = data.link || '';
            document.getElementById('updateForce').value = data.force || 'false';
        }

        async function unblockDevice(deviceId) {
            if (confirm('Unblock this device?')) {
                await fetch('/api/admin/unblock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                });
                loadBlockedDevices();
            }
        }

        async function deleteApi(id) {
            if (confirm('Delete this API?')) {
                await fetch('/api/admin/delete-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                loadApis();
            }
        }

        function showAddApiModal() {
            document.getElementById('addApiModal').classList.remove('hidden');
        }

        function closeAddApiModal() {
            document.getElementById('addApiModal').classList.add('hidden');
        }

        document.getElementById('addApiForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const api = {
                name: document.getElementById('apiName').value,
                url: document.getElementById('apiUrl').value,
                method: document.getElementById('apiMethod').value,
                status: document.getElementById('apiStatus').value
            };
            
            await fetch('/api/admin/add-api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(api)
            });
            
            closeAddApiModal();
            loadApis();
        });

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const update = {
                available: document.getElementById('updateAvailable').value === 'true',
                version: document.getElementById('updateVersion').value,
                link: document.getElementById('updateLink').value,
                force: document.getElementById('updateForce').value === 'true'
            };
            
            await fetch('/api/admin/update-app', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(update)
            });
            
            alert('Update settings saved!');
        });

        function showTab(tab) {
            currentTab = tab;
            document.getElementById('blockedTab').classList.add('hidden');
            document.getElementById('apisTab').classList.add('hidden');
            document.getElementById('updateTab').classList.add('hidden');
            
            document.getElementById(`${tab}Tab`).classList.remove('hidden');
        }

        function logout() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
        }
    </script>
</body>
</html>
