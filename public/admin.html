<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel X SMS - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53, #FF4757);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 48px;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #00FF88;
        }
        
        .section {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .section h2 {
            color: #FF6B6B;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        th {
            background: rgba(255,107,107,0.3);
            color: #FF6B6B;
        }
        
        .btn {
            background: linear-gradient(135deg, #FF6B6B, #FF4757);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            color: white;
            margin-bottom: 5px;
        }
        
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #FF6B6B;
            background: rgba(0,0,0,0.5);
            color: white;
        }
        
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
        }
        
        .login-form h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loginDiv" class="login-form">
        <h2>🔐 Admin Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="btn" onclick="login()" style="width: 100%;">Login</button>
    </div>
    
    <div id="adminPanel" class="container hidden">
        <div class="header">
            <h1>PANEL X SMS - ADMIN PANEL</h1>
            <p>Advanced Control System</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
        </div>
        
        <div class="section">
            <h2>🚫 Blocked Devices</h2>
            <div style="overflow-x: auto;">
                <table id="blockedTable">
                    <thead>
                        <tr><th>Device Name</th><th>Device ID</th><th>Blocked Number</th><th>Date</th></tr>
                    </thead>
                    <tbody id="blockedList"></tbody>
                </table>
            </div>
        </div>
        
        <div class="section">
            <h2>📡 API Management</h2>
            <div class="input-group">
                <label>API Name</label>
                <input type="text" id="apiName" placeholder="e.g., Primary API">
            </div>
            <div class="input-group">
                <label>API URL</label>
                <input type="text" id="apiUrl" placeholder="https://example.com/api">
            </div>
            <div class="input-group">
                <label>API Key (Optional)</label>
                <input type="text" id="apiKey" placeholder="API Key">
            </div>
            <button class="btn" onclick="addApi()">➕ Add API</button>
            
            <div style="margin-top: 20px;">
                <table id="apiTable">
                    <thead><tr><th>Name</th><th>URL</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="apiList"></tbody>
                </table>
            </div>
        </div>
        
        <div class="section">
            <h2>🔄 App Update Control</h2>
            <div class="input-group">
                <label>Package Name</label>
                <input type="text" id="pkgName" value="com.sms.panelx">
            </div>
            <div class="input-group">
                <label>Version Code</label>
                <input type="number" id="versionCode" value="1">
            </div>
            <div class="input-group">
                <label>Version Name</label>
                <input type="text" id="versionName" value="1.0">
            </div>
            <div class="input-group">
                <label>Update Available (yes/no)</label>
                <select id="updateAvailable">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <div class="input-group">
                <label>Update Link</label>
                <input type="text" id="updateLink" placeholder="https://example.com/app.apk">
            </div>
            <div class="input-group">
                <label>Force Update (0/1)</label>
                <select id="forceUpdate">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>
            <button class="btn" onclick="updateApp()">💾 Save Update Settings</button>
        </div>
    </div>
    
    <script>
        let token = '';
        let serverUrl = window.location.origin;
        
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch(serverUrl + '/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    token = data.token;
                    document.getElementById('loginDiv').classList.add('hidden');
                    document.getElementById('adminPanel').classList.remove('hidden');
                    loadStats();
                    loadBlockedDevices();
                    loadApis();
                } else {
                    alert('Invalid credentials!');
                }
            });
        }
        
        function loadStats() {
            fetch(serverUrl + '/api/admin/usage-stats')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const stats = data.stats;
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card"><h3>Total Users</h3><div class="value">${stats.total_users}</div></div>
                        <div class="stat-card"><h3>Today Users</h3><div class="value">${stats.today_users}</div></div>
                        <div class="stat-card"><h3>Yesterday Users</h3><div class="value">${stats.yesterday_users}</div></div>
                        <div class="stat-card"><h3>Monthly Users</h3><div class="value">${stats.monthly_users}</div></div>
                        <div class="stat-card"><h3>Online Users</h3><div class="value">${stats.online_users}</div></div>
                        <div class="stat-card"><h3>Total Requests</h3><div class="value">${stats.total_requests}</div></div>
                        <div class="stat-card"><h3>Success Rate</h3><div class="value">${stats.total_requests > 0 ? ((stats.total_success/stats.total_requests)*100).toFixed(1) : 0}%</div></div>
                    `;
                }
            });
        }
        
        function loadBlockedDevices() {
            fetch(serverUrl + '/api/admin/blocked-devices')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const html = data.devices.map(device => `
                        <tr>
                            <td>${device.device_name}</td>
                            <td>${device.device_id}</td>
                            <td>${device.blocked_number}</td>
                            <td>${new Date(device.blocked_date).toLocaleString()}</td>
                        </tr>
                    `).join('');
                    document.getElementById('blockedList').innerHTML = html;
                }
            });
        }
        
        function loadApis() {
            fetch(serverUrl + '/api/admin/list-apis')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const html = data.apis.map(api => `
                        <tr>
                            <td>${api.api_name}</td>
                            <td>${api.api_url}</td>
                            <td><span style="color: #00FF88">Active</span></td>
                            <td><button class="btn" onclick="deleteApi(${api.id})">Delete</button></td>
                        </tr>
                    `).join('');
                    document.getElementById('apiList').innerHTML = html;
                }
            });
        }
        
        function addApi() {
            const api_name = document.getElementById('apiName').value;
            const api_url = document.getElementById('apiUrl').value;
            const api_key = document.getElementById('apiKey').value;
            
            fetch(serverUrl + '/api/admin/add-api', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({api_name, api_url, api_key})
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('API added successfully!');
                    loadApis();
                    document.getElementById('apiName').value = '';
                    document.getElementById('apiUrl').value = '';
                    document.getElementById('apiKey').value = '';
                }
            });
        }
        
        function deleteApi(id) {
            if(confirm('Delete this API?')) {
                fetch(serverUrl + '/api/admin/delete-api/' + id, {method: 'DELETE'})
                .then(() => loadApis());
            }
        }
        
        function updateApp() {
            const data = {
                package_name: document.getElementById('pkgName').value,
                version_code: parseInt(document.getElementById('versionCode').value),
                version_name: document.getElementById('versionName').value,
                update_available: document.getElementById('updateAvailable').value,
                update_link: document.getElementById('updateLink').value,
                force_update: parseInt(document.getElementById('forceUpdate').value)
            };
            
            fetch(serverUrl + '/api/admin/update-app', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('App update settings saved!');
                }
            });
        }
        
        setInterval(() => {
            if(token) loadStats();
        }, 30000);
    </script>
</body>
</html>
