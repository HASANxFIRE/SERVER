<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel X SMS - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #f5f5f5;
            color: #333;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: opacity 0.3s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Panel X SMS - Admin Panel</h1>
            <p>Advanced SMS Management System</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('blocked')">🚫 Blocked Devices</div>
            <div class="tab" onclick="showTab('apis')">📡 API Management</div>
            <div class="tab" onclick="showTab('update')">🔄 App Update</div>
            <div class="tab" onclick="showTab('usage')">📊 Usage Details</div>
        </div>
        
        <div id="blocked" class="tab-content active">
            <div class="section">
                <h2>🚫 Blocked Devices List</h2>
                <div id="blockedList"></div>
            </div>
        </div>
        
        <div id="apis" class="tab-content">
            <div class="section">
                <h2>📡 SMS API Configuration</h2>
                <button onclick="showAddApiModal()">+ Add New API</button>
                <div id="apiList"></div>
            </div>
        </div>
        
        <div id="update" class="tab-content">
            <div class="section">
                <h2>🔄 App Update Settings</h2>
                <div id="updateSettings"></div>
            </div>
        </div>
        
        <div id="usage" class="tab-content">
            <div class="section">
                <h2>📊 Detailed Usage Statistics</h2>
                <div id="usageDetails"></div>
            </div>
        </div>
    </div>
    
    <!-- Add API Modal -->
    <div id="apiModal" class="modal">
        <div class="modal-content">
            <h3>Add New API</h3>
            <input type="text" id="apiName" placeholder="API Name">
            <input type="text" id="apiUrl" placeholder="API URL">
            <input type="text" id="apiKey" placeholder="API Key (optional)">
            <input type="number" id="priority" placeholder="Priority (1-10)" value="5">
            <button onclick="addApi()">Save API</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        
        async function loadStats() {
            const response = await fetch(`${API_BASE}/api/admin/usage-stats`);
            const stats = await response.json();
            
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>Today's Users</h3>
                    <div class="value">${stats.today.users}</div>
                </div>
                <div class="stat-card">
                    <h3>Online Users</h3>
                    <div class="value">${stats.monthly.onlineUsers}</div>
                </div>
                <div class="stat-card">
                    <h3>Total SMS Sent</h3>
                    <div class="value">${stats.monthly.totalSmsSent}</div>
                </div>
                <div class="stat-card">
                    <h3>API Success Rate</h3>
                    <div class="value">${stats.monthly.totalApiSuccess > 0 ? Math.round((stats.monthly.totalApiSuccess / stats.monthly.totalApiRequests) * 100) : 0}%</div>
                </div>
            `;
        }
        
        async function loadBlockedDevices() {
            const response = await fetch(`${API_BASE}/api/admin/blocked-devices`);
            const devices = await response.json();
            
            const blockedList = document.getElementById('blockedList');
            if (devices.length === 0) {
                blockedList.innerHTML = '<p>No blocked devices</p>';
                return;
            }
            
            blockedList.innerHTML = `
                <table>
                    <thead>
                        <tr><th>Device Name</th><th>Device Model</th><th>Phone Number</th><th>Blocked Date</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        ${devices.map(device => `
                            <tr>
                                <td>${device.deviceName || 'Unknown'}</td>
                                <td>${device.deviceModel || 'Unknown'}</td>
                                <td>${device.phoneNumber || 'Unknown'}</td>
                                <td>${new Date(device.blockedDate).toLocaleString()}</td>
                                <td><button class="btn-success" onclick="unblockDevice('${device.deviceId}')">Unblock</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        async function loadApis() {
            const response = await fetch(`${API_BASE}/api/admin/apis`);
            const apis = await response.json();
            
            const apiList = document.getElementById('apiList');
            apiList.innerHTML = `
                <table>
                    <thead><tr><th>Name</th><th>URL</th><th>Status</th><th>Priority</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${apis.map(api => `
                            <tr>
                                <td>${api.apiName}</td>
                                <td>${api.apiUrl}</td>
                                <td>${api.isActive ? '✅ Active' : '❌ Inactive'}</td>
                                <td>${api.priority}</td>
                                <td>
                                    <button onclick="toggleApiStatus('${api._id}', ${!api.isActive})">${api.isActive ? 'Disable' : 'Enable'}</button>
                                    <button class="btn-danger" onclick="deleteApi('${api._id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        async function loadUpdateSettings() {
            const response = await fetch(`${API_BASE}/api/admin/apis`);
            // Get update settings from a separate endpoint
            const updateResponse = await fetch(`${API_BASE}/api/check-update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ packageName: 'com.sms.panelx', currentVersion: '1.0' })
            });
            const update = await updateResponse.json();
            
            const updateSettings = document.getElementById('updateSettings');
            updateSettings.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <label>Update Available:</label>
                    <select id="updateAvailable">
                        <option value="true" ${update.hasUpdate ? 'selected' : ''}>Yes</option>
                        <option value="false" ${!update.hasUpdate ? 'selected' : ''}>No</option>
                    </select>
                </div>
                <div>
                    <label>Update URL:</label>
                    <input type="text" id="updateUrl" value="${update.updateUrl || ''}" placeholder="https://example.com/app.apk">
                </div>
                <div>
                    <label>Version Name:</label>
                    <input type="text" id="versionName" value="${update.versionName || '1.0.0'}">
                </div>
                <div>
                    <label>Force Update:</label>
                    <select id="forceUpdate">
                        <option value="true" ${update.forceUpdate ? 'selected' : ''}>Yes</option>
                        <option value="false" ${!update.forceUpdate ? 'selected' : ''}>No</option>
                    </select>
                </div>
                <div>
                    <label>Release Notes:</label>
                    <textarea id="releaseNotes" rows="3">${update.releaseNotes || ''}</textarea>
                </div>
                <button onclick="saveUpdateSettings()">Save Update Settings</button>
            `;
        }
        
        async function saveUpdateSettings() {
            const updateAvailable = document.getElementById('updateAvailable').value === 'true';
            const updateUrl = document.getElementById('updateUrl').value;
            const versionName = document.getElementById('versionName').value;
            const forceUpdate = document.getElementById('forceUpdate').value === 'true';
            const releaseNotes = document.getElementById('releaseNotes').value;
            
            const response = await fetch(`${API_BASE}/api/admin/update-app`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    updateAvailable,
                    updateUrl,
                    versionName,
                    forceUpdate,
                    releaseNotes,
                    versionCode: Date.now().toString()
                })
            });
            
            if (response.ok) {
                alert('Update settings saved successfully!');
            }
        }
        
        async function unblockDevice(deviceId) {
            if (confirm('Unblock this device?')) {
                await fetch(`${API_BASE}/api/admin/unblock-device`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                });
                loadBlockedDevices();
            }
        }
        
        async function toggleApiStatus(id, status) {
            await fetch(`${API_BASE}/api/admin/update-api/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isActive: status })
            });
            loadApis();
        }
        
        async function deleteApi(id) {
            if (confirm('Delete this API?')) {
                await fetch(`${API_BASE}/api/admin/delete-api/${id}`, {
                    method: 'DELETE'
                });
                loadApis();
            }
        }
        
        function showAddApiModal() {
            document.getElementById('apiModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('apiModal').style.display = 'none';
        }
        
        async function addApi() {
            const apiData = {
                apiName: document.getElementById('apiName').value,
                apiUrl: document.getElementById('apiUrl').value,
                apiKey: document.getElementById('apiKey').value,
                priority: parseInt(document.getElementById('priority').value)
            };
            
            await fetch(`${API_BASE}/api/admin/add-api`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(apiData)
            });
            
            closeModal();
            loadApis();
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        // Load all data
        loadStats();
        loadBlockedDevices();
        loadApis();
        loadUpdateSettings();
        
        // Refresh every 30 seconds
        setInterval(() => {
            loadStats();
            loadBlockedDevices();
        }, 30000);
    </script>
</body>
</html>
